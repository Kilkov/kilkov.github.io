<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pazarski list</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    .root {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 260px;
      background: #111827;
      color: #e5e7eb;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sidebar-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sidebar-title {
      font-size: 18px;
      font-weight: 600;
    }
    .sidebar-user {
      font-size: 12px;
      color: #9ca3af;
      word-break: break-all;
    }
    .sidebar-section-title {
      font-size: 12px;
      text-transform: uppercase;
      color: #9ca3af;
      letter-spacing: 0.05em;
      margin: 10px 0 4px;
    }
    .sidebar-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sidebar-list-item {
      padding: 6px 8px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
      color: #e5e7eb;
    }
    .sidebar-list-item span {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar-list-item.active {
      background: #2563eb;
    }
    .sidebar-list-item.readonly {
      opacity: 0.7;
    }
    .sidebar-list-item button {
      border: none;
      background: transparent;
      color: #9ca3af;
      cursor: pointer;
      padding: 0;
      font-size: 14px;
    }
    .sidebar-button {
      width: 100%;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #374151;
      background: #111827;
      color: #e5e7eb;
      cursor: pointer;
      font-size: 13px;
    }

    .app {
      flex: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 {
      margin: 0;
      text-align: left;
    }
    h2 {
      margin-top: 0;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
    }
    @media (max-width: 900px) {
      .root {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
      }
    }
    .list-form, .item-form {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .list-form input, .item-form input, .item-form select {
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      flex: 1;
      min-width: 0;
    }
    button.primary {
      padding: 6px 10px;
      border-radius: 4px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      white-space: nowrap;
    }
    button.secondary {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      color: #111;
      cursor: pointer;
      white-space: nowrap;
    }
    button.primary:disabled, button.secondary:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .category-section {
      margin-top: 12px;
    }
    .category-header {
      font-weight: 600;
      margin: 8px 0 4px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .category-subtotal {
      font-size: 12px;
      color: #4b5563;
    }
    table.items-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 8px;
      font-size: 13px;
    }
    table.items-table th,
    table.items-table td {
      border: 1px solid #e5e7eb;
      padding: 4px 6px;
      vertical-align: middle;
    }
    table.items-table th {
      background: #f3f4f6;
      text-align: left;
      font-weight: 600;
    }
    table.items-table input[type="text"],
    table.items-table input[type="number"],
    table.items-table select {
      width: 100%;
      font-size: 12px;
      padding: 2px 4px;
      box-sizing: border-box;
    }
    table.items-table input[type="checkbox"] {
      transform: scale(1.1);
    }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 16px;
    }
    .section-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .info-text {
      font-size: 12px;
      color: #555;
      margin-top: 4px;
    }
    .tag {
      font-size: 11px;
      padding: 2px 5px;
      border-radius: 4px;
      background: #e5e7eb;
      color: #374151;
    }
    .auth-card {
      max-width: 400px;
      margin: 40px auto;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .auth-form input {
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    .auth-toggle {
      margin-top: 8px;
      font-size: 13px;
    }
    .auth-toggle button {
      border: none;
      background: none;
      color: #2563eb;
      cursor: pointer;
      padding: 0;
    }
    .auth-message {
      font-size: 13px;
      margin-top: 8px;
    }
    .auth-message.error {
      color: #b91c1c;
    }
    .auth-message.info {
      color: #2563eb;
    }
  </style>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Auth container -->
  <div id="authContainer">
    <div class="card auth-card">
      <h2 style="text-align:center;">Pazarski list</h2>
      <p style="text-align:center;font-size:13px;color:#555;">
        Login or register to manage your shopping lists.
      </p>
      <form id="authForm" class="auth-form">
        <input id="authEmail" type="email" placeholder="Email" required />
        <input id="authPassword" type="password" placeholder="Password" required />
        <button type="submit" class="primary" id="authSubmitBtn">Login</button>
      </form>
      <div class="auth-toggle">
        <span id="authToggleText">Need an account?</span>
        <button id="authToggleBtn" type="button">Register</button>
      </div>
      <p id="authMessage" class="auth-message"></p>
    </div>
  </div>

  <!-- Main app container -->
  <div id="appContainer" style="display:none;">
    <div class="root">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title">Pazarski list</div>
          <div id="sidebarUserEmail" class="sidebar-user"></div>
        </div>

        <button id="newListBtn" type="button" class="sidebar-button">New list</button>

        <div>
          <div class="sidebar-section-title">Active lists</div>
          <ul id="activeListsSidebar" class="sidebar-list"></ul>
        </div>

        <button id="logoutBtn" type="button" class="sidebar-button">Logout</button>

        <div>
          <div class="sidebar-section-title">Archived lists</div>
          <ul id="archivedListsSidebar" class="sidebar-list"></ul>
        </div>
      </aside>

      <main class="app">
        <div class="card">
          <div class="section-title-row">
            <h1>Shopping list</h1>
            <span id="currentListStatusTag" class="tag"></span>
          </div>
          <p class="info-text">
            Lists are tied to your account. Subtotals are shown per category.
          </p>

          <form class="list-form" id="listTitleForm">
            <input
              id="listTitleInput"
              type="text"
              placeholder="List title"
              autocomplete="off"
            />
            <button type="submit" class="primary">Save title</button>
            <button type="button" class="secondary" id="completeListBtn">Mark completed</button>
          </form>
        </div>

        <div class="layout">
          <div>
            <div class="card" id="currentListCard" style="display:none;">
              <div class="section-title-row">
                <h2 id="currentListTitle" style="margin:0;"></h2>
                <span id="totalPriceTag" class="tag" style="display:none;"></span>
              </div>

              <form class="item-form" id="itemForm">
                <input id="itemNameInput" type="text" placeholder="Item" autocomplete="off" />
                <input id="itemQtyInput" type="text" placeholder="Qty (e.g. 2, 1kg)" autocomplete="off" />
                <input
